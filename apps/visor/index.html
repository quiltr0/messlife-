<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VISOR DEL MANIFIESTO · MESSLIFE</title>
<style>
:root{--bg:#080b12;--panel:#111722;--border:#273142;--text:#f4f7fb;--muted:#8c98aa;--cyan:#16d5e6;--purple:#9a43ff;--green:#35e0a1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100%}
body{padding:0;overflow:hidden}
.wrap{width:100vw;height:100vh;max-width:none;margin:0;position:relative}
.top{position:absolute;left:14px;bottom:14px;z-index:10;margin:0}
.back{display:inline-flex;align-items:center;color:var(--text);text-decoration:none;font-weight:900;font-size:12px;padding:9px 13px;border:1px solid var(--border);border-radius:10px;background:#0d131d}
.brand,h1,.sub{display:none}
.panel{width:100%;height:100%;border:0;border-radius:0;background:var(--bg);padding:28px 30px 68px}
.viewer{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:28px;width:100%;height:100%;align-items:center}
.route{display:flex;flex-direction:column;gap:20px;min-width:0}
.section-title{display:none}
.route-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:16px;align-items:center}
.chip{min-width:0;text-align:center;border:2px solid #344054;border-radius:14px;padding:15px 10px;font-size:clamp(30px,4.8vw,68px);line-height:1;font-weight:950;background:#0d131d;white-space:nowrap;overflow:hidden}
.chip.start{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan) inset;color:var(--cyan);font-size:clamp(28px,4.2vw,60px)}
.chip.finish{border-color:var(--purple);box-shadow:0 0 0 2px var(--purple) inset;color:#c38cff;font-size:clamp(28px,4.2vw,60px)}
.empty{color:var(--muted);font-size:22px;padding:30px 0}
.timer{display:flex;flex-direction:column;justify-content:center;align-items:center;border-left:1px solid var(--border);padding:20px 0 20px 24px;background:transparent}
.timer-label{font-size:9px;color:var(--muted);font-weight:900;letter-spacing:.12em;margin-bottom:7px;text-align:center}
.time{font-variant-numeric:tabular-nums;font-size:clamp(34px,4vw,58px);line-height:1;font-weight:900;letter-spacing:-.04em}
.time.done{color:#ff668a}
.timer-status{display:none}
.legend{display:none}
@media (max-width:700px){
  body{padding:0;overflow:hidden}
  .panel{
    position:relative;
    padding:8px 18px 0;
    height:100svh;
    overflow:hidden;
  }
  .viewer{
    position:relative;
    display:block;
    width:100%;
    height:100%;
  }
  .route{
    position:absolute;
    left:0;
    right:0;
    top:0;
    bottom:150px;
    width:auto;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    padding:0 0 12px;
  }
  .route-list{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
    align-content:start;
    padding-bottom:8px;
  }
  .chip{
    padding:10px 5px;
    font-size:clamp(28px,6vw,58px);
    border-radius:10px;
  }
  .chip.start,.chip.finish{
    font-size:clamp(25px,5.3vw,52px);
  }
  .timer{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    width:100%;
    height:150px;
    min-height:150px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-left:0;
    border-top:1px solid var(--border);
    padding:18px 0 8px;
    background:var(--bg);
    z-index:20;
  }
  .time{font-size:42px}
}
@media (max-width:700px) and (orientation:landscape){
  .panel{padding:14px 18px 54px}
  .viewer{grid-template-columns:minmax(0,1fr) 105px;gap:14px}
  .route-list{gap:8px}
  .chip{padding:10px 6px;font-size:clamp(26px,5.3vw,52px)}
  .chip.start,.chip.finish{font-size:clamp(24px,4.6vw,48px)}
  .timer{padding-left:10px}
  .time{font-size:38px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="../../index.html">← MENÚ PRINCIPAL</a></div>
  <main class="panel">
    <div class="viewer">
      <section class="route">
        
        <div id="routeList" class="route-list"></div>
        <div class="legend"><span><b style="color:var(--cyan)">P</b> Partida</span><span><b style="color:#c38cff">M</b> Meta</span></div>
      </section>
      <aside class="timer">
        <div class="timer-label">TIEMPO DISPONIBLE</div>
        <div id="time" class="time">1:00</div>
        <div id="timerStatus" class="timer-status">Cuenta regresiva automática</div>
      </aside>
    </div>
  </main>
</div>
<script>
(function(){
  let seconds=60;
  const timeEl=document.getElementById('time');
  const statusEl=document.getElementById('timerStatus');
  const routeEl=document.getElementById('routeList');

  function loadRoute(){
    try{
      const s=JSON.parse(localStorage.getItem('messlife_checkpoints')||'null');
      const cps=Array.isArray(s?.cps)?s.cps:[];
      const start=s?.start??null, finish=s?.finish??null;
      const values=[];
      if(start!==null) values.push({v:start,c:'start',p:'P · '});
      cps.forEach(v=>{if(v!==start && v!==finish) values.push({v,c:'',p:''});});
      if(finish!==null) values.push({v:finish,c:'finish',p:'M · '});
      routeEl.innerHTML=values.length
        ? values.map(x=>`<span class="chip ${x.c}">${x.p}${x.v}</span>`).join('')
        : '<div class="empty">No hay checkpoints generados todavía.</div>';
    }catch(e){
      routeEl.innerHTML='<div class="empty">No se pudo cargar el recorrido.</div>';
    }
  }

  function render(){
    const m=Math.floor(seconds/60), s=seconds%60;
    timeEl.textContent=`${m}:${String(s).padStart(2,'0')}`;
    if(seconds===0){
      timeEl.classList.add('done');
      statusEl.textContent='Tiempo terminado';
    }else{
      timeEl.classList.remove('done');
      statusEl.textContent='Cuenta regresiva automática';
    }
  }

  async function lockLandscape(){
    try{
      if(screen.orientation && screen.orientation.lock){
        await screen.orientation.lock('landscape');
      }
    }catch(e){
      // Some browsers only allow orientation lock for installed/fullscreen PWAs.
      // The manifest orientation="landscape" handles supported installed-PWA cases.
    }
  }

  loadRoute();
  render();
  lockLandscape();
  setInterval(()=>{
    if(seconds>0){seconds--;render();}
  },1000);
})();
</script>
</body>
</html>
