<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MESSLIFE — Manifiesto</title>
<style>
:root{--bg:#0d0f16;--p:#171a25;--p2:#222638;--t:#fff;--m:#a8adbf;--line:#363b4e;--purple:#9a43ff;--cyan:#16d5e6;--green:#3de0a5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px 14px 48px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.back{color:#fff;text-decoration:none;background:var(--p2);border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-weight:800;font-size:12px}
.brand{font-weight:900;letter-spacing:3px;color:var(--cyan);font-size:18px}
h1{font-size:28px;margin:8px 0 4px}.sub{color:var(--m);font-size:14px;margin-bottom:18px}
.panel{background:var(--p);border:1px solid var(--line);border-radius:20px;padding:16px;margin:11px 0}
.panel h2{margin:0 0 12px;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
label{display:block;color:var(--m);font-size:11px;margin-bottom:5px}
input,textarea{width:100%;background:#0f121a;color:#fff;border:1px solid #42475b;border-radius:10px;padding:10px;font-size:15px}
textarea{min-height:92px;resize:vertical}
button{border:0;border-radius:12px;padding:12px 13px;font-weight:900;cursor:pointer;font-size:13px}
.primary{background:linear-gradient(90deg,var(--purple),#657cf5,var(--cyan));color:#080910}
.secondary{background:var(--p2);color:#fff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.helper{color:var(--m);font-size:12px;line-height:1.45;margin-top:8px}
.status{color:var(--m);font-size:12px;margin-top:8px;min-height:16px}
.players{display:flex;flex-direction:column;gap:8px}
.player{background:var(--p2);border:1px solid var(--line);border-radius:14px;padding:12px 13px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
.player strong{font-size:15px}.progress{color:var(--m);font-size:12px}.bar{height:7px;background:#0e1118;border-radius:10px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:10px}
.empty{color:var(--m);font-size:13px}
.detail{display:none}.detail.active{display:block}
.detail-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.detail-head h2{margin:0}.back-detail{background:var(--p2);color:#fff}
.checks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.check{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}
.check label{display:flex;align-items:center;justify-content:center;gap:7px;color:#fff;font-size:13px;margin:0;cursor:pointer}
.check input{width:auto;margin:0;accent-color:var(--cyan)}
.check.done{border-color:var(--green)}
.badge{display:inline-block;background:rgba(61,224,165,.14);color:var(--green);border:1px solid rgba(61,224,165,.4);padding:4px 7px;border-radius:999px;font-size:10px;font-weight:900}
.small-note{color:var(--m);font-size:11px;margin-top:9px}
.danger{width:100%;margin-top:9px;background:#2a2e3f;color:#fff}
@media(max-width:600px){.grid{grid-template-columns:1fr}.checks{grid-template-columns:repeat(3,1fr)}}

.dialog-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}
.dialog-backdrop.show{display:flex}
.dialog{width:min(100%,430px);background:#20232e;border:1px solid #34394d;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 0 1px rgba(154,67,255,.12) inset;overflow:hidden}
.dialog-accent{height:4px;background:linear-gradient(90deg,#9a43ff,#657cf5,#16d5e6)}
.dialog-body{padding:22px 22px 18px}
.dialog-brand{font-size:11px;letter-spacing:2px;font-weight:900;color:#16d5e6;text-transform:uppercase;margin-bottom:10px}
.dialog-title{font-size:20px;font-weight:900;margin:0 0 9px;color:#f7f7fb}
.dialog-message{font-size:15px;line-height:1.5;color:#a7acbd;margin:0}
.dialog-actions{display:flex;gap:10px;padding:0 22px 20px;justify-content:flex-end}
.dialog-btn{border:0;border-radius:12px;padding:12px 18px;font-weight:900;font-size:13px;cursor:pointer}
.dialog-btn.cancel{background:#2a2e3d;color:#fff}
.dialog-btn.confirm{background:linear-gradient(90deg,#9a43ff,#657cf5,#16d5e6);color:#090a10}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="../../index.html">← MESSLIFE</a>
    <div class="brand">MANIFIESTO</div>
  </div>
  <h1>Control de carrera</h1>
  <div class="sub">Registro digital de jugadores y checkpoints · Panel del organizador</div>

  <section class="panel" id="overview">
    <h2>Progreso de jugadores</h2>
    <div id="playerList" class="players"><div class="empty">Aún no hay jugadores registrados.</div></div>
  </section>

  <section class="panel detail" id="detail">
    <div class="detail-head">
      <div>
        <h2 id="detailName">Jugador</h2>
        <div class="small-note" id="detailProgress"></div>
      </div>
      <button class="back-detail" id="backOverview">← VOLVER</button>
    </div>
    <div id="detailChecks" class="checks"></div>
  </section>

  <section class="panel">
    <button class="danger" id="reset">REINICIAR MANIFIESTO</button>
  </section>
</div>

<script>

function messlifeLocked(){
  return localStorage.getItem('messlife_locked')==='1';
}
function blockResetIfLocked(){
  if(messlifeLocked()){
    alert('Los datos están bloqueados. Desbloquéalos desde la página principal para poder reiniciar información.');
    return true;
  }
  return false;
}
let checkpoints = [];
let players = [];
let selectedPlayer = null;
const $ = id => document.getElementById(id);

function cleanValue(s){
  s=s.trim().replace(/^[PM]\s*[·:-]\s*/i,'');
  return s;
}
function compare(a,b){
  const an=/^\d+$/.test(a),bn=/^\d+$/.test(b);
  if(an&&bn)return Number(a)-Number(b);
  if(an&&!bn)return -1;
  if(!an&&bn)return 1;
  return a.localeCompare(b);
}
function parseCheckpoints(text){
  const raw=text.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean);
  const out=[];
  for(const item of raw){
    const v=cleanValue(item);
    if(/^\d+$/.test(v)||/^[A-H]$/i.test(v)){
      const x=v.toUpperCase();
      if(!out.includes(x))out.push(x);
    }
  }
  return out.sort(compare);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function loadCentralPlayers(){
  try{
    const names=JSON.parse(localStorage.getItem('messlife_players')||'[]')||[];
    const oldByName=new Map(players.map(p=>[p.name.toLowerCase(),p]));
    players=names.map(name=>{
      const old=oldByName.get(String(name).toLowerCase());
      return old?{name,done:Array.isArray(old.done)?old.done.filter(x=>checkpoints.includes(x)):[]}:{name,done:[]};
    });
  }catch(e){players=[]}
}
function loadCentralCheckpoints(){
  try{
    const d=JSON.parse(localStorage.getItem('messlife_checkpoints')||'null');
    const incoming=d?.cps||[];
    const start=d?.start??null,finish=d?.finish??null;
    checkpoints=Array.isArray(incoming)
      ? incoming.filter(v=>v!==start&&v!==finish).map(String).sort(compare)
      : [];
  }catch(e){
    checkpoints=[];
  }
}
function renderPlayers(){
  const list=$('playerList');
  if(!players.length){list.innerHTML='<div class="empty">Aún no hay jugadores registrados.</div>';return}
  list.innerHTML=players.map((p,i)=>{
    const done=p.done.length,total=checkpoints.length,pct=total?Math.round(done/total*100):0;
    return `<div class="player" data-index="${i}">
      <div style="flex:1"><strong>${escapeHtml(p.name)}</strong><div class="bar"><div class="fill" style="width:${pct}%"></div></div></div>
      <div class="progress">${done}/${total}<br>${pct}%</div>
    </div>`;
  }).join('');
  list.querySelectorAll('.player').forEach(el=>el.addEventListener('click',()=>openPlayer(+el.dataset.index)));
}
function renderDetail(){
  if(selectedPlayer===null)return;
  const p=players[selectedPlayer];
  $('detailName').textContent=p.name;
  const done=p.done.length,total=checkpoints.length,pct=total?Math.round(done/total*100):0;
  $('detailProgress').textContent=`${done} de ${total} checkpoints cumplidos · ${pct}%`;
  $('detailChecks').innerHTML=checkpoints.map(cp=>{
    const checked=p.done.includes(cp);
    return `<div class="check ${checked?'done':''}">
      <label><input type="checkbox" data-cp="${escapeHtml(cp)}" ${checked?'checked':''}>${escapeHtml(cp)}</label>
    </div>`;
  }).join('');
  $('detailChecks').querySelectorAll('input').forEach(cb=>cb.addEventListener('change',e=>{
    const cp=e.target.dataset.cp,pp=players[selectedPlayer];
    if(e.target.checked){if(!pp.done.includes(cp))pp.done.push(cp)}
    else pp.done=pp.done.filter(x=>x!==cp);
    renderDetail();renderPlayers();save();
  }));
}
function openPlayer(i){
  selectedPlayer=i;$('overview').style.display='none';$('detail').classList.add('active');renderDetail();
}
function save(){
  try{localStorage.setItem('messlife_manifest',JSON.stringify({checkpoints,players}))}catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('messlife_manifest')||'null');
    if(d){
      checkpoints=Array.isArray(d.checkpoints)?d.checkpoints:[];
      players=Array.isArray(d.players)?d.players:[];
    }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();});
window.addEventListener('pagehide',save);

$('backOverview').addEventListener('click',()=>{
  selectedPlayer=null;$('detail').classList.remove('active');$('overview').style.display='block';renderPlayers();
});
$('reset').addEventListener('click',async()=>{
  if(blockResetIfLocked())return;
  const confirmed=await confirm('¿Reiniciar el manifiesto? Se borrarán los checks realizados, pero se mantendrán los jugadores y los checkpoints de la carrera.');
  if(!confirmed)return;
  players=players.map(p=>({name:p.name,done:[]}));
  selectedPlayer=null;
  $('detail').classList.remove('active');$('overview').style.display='block';
  renderPlayers();save();
});
load();
loadCentralCheckpoints();
loadCentralPlayers();
renderPlayers();
</script>

<div class="dialog-backdrop" id="messlifeDialog" aria-hidden="true">
  <div class="dialog" role="dialog" aria-modal="true">
    <div class="dialog-accent"></div>
    <div class="dialog-body">
      <div class="dialog-brand">MESSLIFE</div>
      <h3 class="dialog-title" id="messlifeDialogTitle">Aviso</h3>
      <p class="dialog-message" id="messlifeDialogMessage"></p>
    </div>
    <div class="dialog-actions" id="messlifeDialogActions"></div>
  </div>
</div>

<script>
(function(){
  const backdrop=document.getElementById('messlifeDialog');
  if(!backdrop)return;
  const title=document.getElementById('messlifeDialogTitle');
  const message=document.getElementById('messlifeDialogMessage');
  const actions=document.getElementById('messlifeDialogActions');
  let resolver=null;
  function close(value){
    backdrop.classList.remove('show');
    backdrop.setAttribute('aria-hidden','true');
    if(resolver){const r=resolver;resolver=null;r(value);}
  }
  window.messlifeDialog=function(opts){
    opts=opts||{};
    title.textContent=opts.title||'Aviso';
    message.textContent=opts.message||'';
    actions.innerHTML='';
    if(opts.confirm){
      const cancel=document.createElement('button');
      cancel.className='dialog-btn cancel';
      cancel.textContent=opts.cancelText||'CANCELAR';
      cancel.onclick=()=>close(false);
      const ok=document.createElement('button');
      ok.className='dialog-btn confirm';
      ok.textContent=opts.confirmText||'ACEPTAR';
      ok.onclick=()=>close(true);
      actions.append(cancel,ok);
      backdrop.onclick=e=>{if(e.target===backdrop)close(false)};
      backdrop.onkeydown=e=>{if(e.key==='Escape')close(false)};
      backdrop.tabIndex=-1;
      backdrop.focus();
      backdrop.classList.add('show');
      backdrop.setAttribute('aria-hidden','false');
      return new Promise(r=>resolver=r);
    }
    const ok=document.createElement('button');
    ok.className='dialog-btn confirm';
    ok.textContent=opts.okText||'ACEPTAR';
    ok.onclick=()=>close(true);
    actions.append(ok);
    backdrop.onclick=e=>{if(e.target===backdrop)close(true)};
    backdrop.classList.add('show');
    backdrop.setAttribute('aria-hidden','false');
    return new Promise(r=>resolver=r);
  };
  window.alert=function(msg){
    return messlifeDialog({title:'Aviso',message:String(msg),okText:'ACEPTAR'});
  };
  window.confirm=function(msg){
    return messlifeDialog({title:'Confirmar',message:String(msg),confirm:true,confirmText:'CONFIRMAR'});
  };
})();
</script></body>
</html>
